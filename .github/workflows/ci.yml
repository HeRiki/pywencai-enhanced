name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e .

      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest tests.test_pywencai

      - name: Build distribution
        run: python -m build

      - name: Install wheel and verify packaged assets
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import importlib.resources as resources
          import pywencai

          assert callable(pywencai.get)
          assert resources.files("pywencai").joinpath("hexin-v.bundle.js").is_file()
          assert resources.files("pywencai").joinpath("hexin-v.js").is_file()
          print("wheel smoke test passed")
          PY
